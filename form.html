<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="author" content="Isaac Williams">
    <meta name="description" content="A form that alows you to give your feedback on our products. Rate your satisfaction, and explain why.">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>

    <link rel="icon" href="images/fav-icon.svg" type="image/svg">

     <!-- The fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fredoka:wght@300..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
    <main>
        <header>
            <h1>Product Review</h1>
        </header>


        <form method="get" action="review.html" class="wf1">

            <!-- The Product Name Part -->
            <label class="bold">Product Name*<select id="proName" name="proName" required>
                <option disabled selected value="">Select a Product ... &#9660;</option>
            </select></label>

            <!--The Star Rating Part -->
            <div class="divLabel bold">Star Rating*</div>
            <div class="starRatingGroup">
                <input type="radio" name="starRating" id="5star" value="5" required> <label for="5star"><span class="visually-hidden">5 stars</span></label>
                <input type="radio" name="starRating" id="4star" value="4" required> <label for="4star"><span class="visually-hidden">4 stars</span></label>
                <input type="radio" name="starRating" id="3star" value="3" required> <label for="3star"><span class="visually-hidden">3 stars</span></label>
                <input type="radio" name="starRating" id="2star" value="2" required> <label for="2star"><span class="visually-hidden">2 stars</span></label>
                <input type="radio" name="starRating" id="1star" value="1" required> <label for="1star"><span class="visually-hidden">1 stars</span></label>
            </div>

            <!-- The Date of instalation Part -->
            <label class="bold">Date of Instalation*<input type="date" id="dateOfInstal" name="dateOfInstal" required></label>
        
            <!--he Useful Features Part-->
            <div class="divLabel">What features did you find useful?</div>
            <p>(Please select all that aply)</p>
            <label><input type="checkbox" id="durability" name="durability" value="yes">Durability</label>
            <label><input type="checkbox" id="ease" name="ease" value="yes">Ease of Use</label>
            <label><input type="checkbox" id="performance" name="performance" value="yes">Performance</label>
            <label><input type="checkbox" id="design" name="design" value="yes">Design</label>

            <!-- The Writen Review Part -->
            <label>Writen Review<span class="smallPrint">(This is optional)</span><textarea id="writenReview" name="writenReview"></textarea></label>

            <!-- The Name Part -->
            <label>Your Name<span class="smallPrint">(This is optional)</span><input type="text" id="name" name="name"></label>

            <!-- The Submit Button Part -->
            <button type="submit" class="readyButton">Post Your Review</button>
        </form>
    </main>
    <footer>
        <p>&copy;<span id="currentyear"></span> 🔥 Isaac Williams 🔥 Utah</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
